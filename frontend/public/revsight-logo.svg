<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" role="img" aria-labelledby="title desc">
  <title id="title">RevSight Logo</title>
  <desc id="desc">Eye icon with growth arrow and RevSight wordmark.</desc>
  <defs>
    <linearGradient id="eyeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a72" />
      <stop offset="100%" stop-color="#132f62" />
    </linearGradient>
    <linearGradient id="arrowStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e9f79" />
      <stop offset="100%" stop-color="#26be87" />
    </linearGradient>
  </defs>

  <g transform="translate(10 8)">
    <path
