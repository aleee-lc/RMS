      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="140" cy="62" r="24" fill="none" stroke="url(#eyeStroke)" stroke-width="10" />
    <rect x="105" y="78" width="14" height="22" rx="3" fill="#1a3a72" />
    <rect x="125" y="67" width="14" height="33" rx="3" fill="#1a3a72" />
    <rect x="145" y="58" width="14" height="42" rx="3" fill="#1a3a72" />
    <rect x="165" y="49" width="14" height="51" rx="3" fill="#1a3a72" />
    <path
      d="M82 86 L128 56 L167 56 L208 20"
      fill="none"
      stroke="url(#arrowStroke)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
