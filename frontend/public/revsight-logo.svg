    y="88"
    font-size="80"
    font-family="Sora, Segoe UI, Arial, sans-serif"
    font-weight="700"
    letter-spacing="-1.4"
  >
    <tspan fill="#132f62">Rev</tspan><tspan fill="#20ac78">Sight</tspan>
  </text>
