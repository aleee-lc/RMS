<ng-container *ngIf="showShell(); else publicRoute">
<div class="app-shell">
  <aside
    class="sidebar"
    [class.menu-open]="mobileMenuOpen()"
    [class.pinned]="sidebarPinned()"
  >
    <div class="brand">
      <img class="brand-logo" src="/revsight-logo.svg" alt="RevSight" />
      <div class="brand-copy">
        <strong>Command Center</strong>
        <small>{{ user()?.name ?? 'Revenue Management BI' }}</small>
      </div>
    </div>

    <button
      mat-icon-button
      class="pin-button"
      type="button"
      [attr.aria-label]="sidebarPinned() ? 'Contraer sidebar' : 'Fijar sidebar abierto'"
      (click)="toggleSidebarPinned()"
    >
      <mat-icon>{{ sidebarPinned() ? 'keyboard_double_arrow_left' : 'keyboard_double_arrow_right' }}</mat-icon>
    </button>

    <button mat-icon-button class="mobile-menu-button" type="button" (click)="toggleMobileMenu()">
      <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <mat-form-field class="hotel-select" appearance="outline" *ngIf="hotels().length">
        <mat-label>Propiedad</mat-label>
        <mat-select [value]="selectedHotelId()" (selectionChange)="onHotelChanged($event.value)">
          <mat-option *ngFor="let hotel of hotels()" [value]="hotel.id">
            {{ hotel.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <nav class="side-nav" aria-label="Navegacion principal">
        <section class="nav-group" *ngFor="let group of navGroups">
          <h2>{{ group.label }}</h2>
        <a
          *ngFor="let item of group.items"
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          (click)="closeMobileMenu()"
        >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        </section>
      </nav>

      <button mat-stroked-button class="logout-button" (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        Salir
      </button>
    </aside>

    <main class="content" role="main">
      <router-outlet />
    </main>
  </div>
</ng-container>

<ng-template #publicRoute>
  <router-outlet />
</ng-template>
