<form [formGroup]="form" class="date-range-form">
  <mat-form-field appearance="outline" class="range-field">
    <mat-label>Rango de fechas</mat-label>
    <mat-date-range-input [rangePicker]="picker">
      <input matStartDate formControlName="startDate" placeholder="Fecha inicial" />
      <input matEndDate formControlName="endDate" placeholder="Fecha final" />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>
    <mat-error *ngIf="form.controls.endDate.hasError('invalidRange')">
      La fecha final debe ser mayor o igual a la inicial.
    </mat-error>
  </mat-form-field>

  <button mat-flat-button color="primary" type="button" (click)="onApply()" [disabled]="disabled">
    <mat-icon>calendar_month</mat-icon>
    Aplicar
  </button>
</form>

<div class="preset-row" *ngIf="showPresets">
  <span class="preset-label">Atajos:</span>
  <button mat-stroked-button type="button" (click)="onApplyPreset(7)" [disabled]="disabled">
    {{ mode === 'past' ? 'Ultimos 7 dias' : 'Proximos 7 dias' }}
  </button>
  <button mat-stroked-button type="button" (click)="onApplyPreset(30)" [disabled]="disabled">
    {{ mode === 'past' ? 'Ultimos 30 dias' : 'Proximos 30 dias' }}
  </button>
  <button mat-stroked-button type="button" (click)="onApplyPreset(90)" [disabled]="disabled">
    {{ mode === 'past' ? 'Ultimos 90 dias' : 'Proximos 90 dias' }}
  </button>
</div>
