<mat-card class="kpi-card">
  <mat-card-content>
    <div class="kpi-header">
      <span class="kpi-title">{{ title() }}</span>
      <mat-icon>{{ icon() }}</mat-icon>
    </div>
    <div class="kpi-value">{{ value() }}</div>
    <div class="kpi-subtitle" *ngIf="subtitle()">{{ subtitle() }}</div>
  </mat-card-content>
</mat-card>
